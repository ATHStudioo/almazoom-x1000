name: Publish AlmaZoom 1.1.3 beta 1
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-1.1.3-beta1.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: a04fca291ea341e92f7f0460fbb6e1768f11fee6
      APK: AlmaZoom-v1.1.3-beta1.apk
    steps:
      - name: Verify APK and publish prerelease
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "$APK" "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$RELEASE_COMMIT/downloads/$APK"
          echo "7758f9b1a454132480eaf07be3658ba77d2d49f28f1a035b2656da80f051e2f9  $APK" | sha256sum -c -
          gh release create v1.1.3-beta1 "$APK" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --prerelease --title 'AlmaZoom 1.1.3 beta 1 · Samsung Camera 16' --notes 'Adds an experimental profile for Samsung Camera 16.0.00.66 (reported on One UI 8.0, exact model unconfirmed). Hooks were checked against the APK. Preview and saved JPEG still require on-device testing. The downloadable beta is an APK-only preview. The source in this tag corresponds to 1.1.2. Xiaomi Camera 6.3.007270.1 requires a separate profile.'
