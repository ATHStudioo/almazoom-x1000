name: Restore original AlmaZoom Samsung release
on:
  push:
    branches: [main]
    paths: [.github/workflows/restore-original-samsung-release.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      APK: AlmaZoom-v1.1.2.apk
    steps:
      - name: Verify original APK and restore release
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "$APK" "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/v1.1.2/downloads/$APK"
          echo "3aba3aeeb22c6a6b7c86516d44357b2404e124303338e49077388eb6b6af4590  $APK" | sha256sum -c -
          gh release create v1.1.2 "$APK" --repo "$GITHUB_REPOSITORY" --verify-tag --latest --title 'AlmaZoom 1.1.2 · One UI 8.5+ · Original Samsung build' --notes 'Original AlmaZoom Samsung build for Camera 17.0.00.43. Profile checked against the Galaxy S25 Ultra SM-S938U1 camera APK. Other Samsung Camera builds need separate verification. One UI 8.0 and Xiaomi have separate releases.'
