name: Publish AlmaZoom 1.1.3 beta 2
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-1.1.3-beta2.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: fd0e7bf36cb69cf75d4f22ceeda178b94c0ebe13
      APK: AlmaZoom-v1.1.3-beta2.apk
      APK_SHA256: 2d18822bc816b29f633a53c19216e24f30afd1ebec84f815a111c8611140ccc7
    steps:
      - name: Verify APK and publish prerelease
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "$APK" "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$RELEASE_COMMIT/downloads/$APK"
          echo "$APK_SHA256  $APK" | sha256sum -c -
          gh release create v1.1.3-beta2 "$APK" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --prerelease --title 'AlmaZoom 1.1.3 beta 2 · One UI 8.0 preview fix' --notes 'Replaces beta 1 for Samsung Camera 16.0.00.66. The centered crop scales the preview buffer inside the original viewport, and the zoom readout no longer adds a second multiplication sign. APK signature and center-crop geometry verified. Preview and saved JPEG require an on-device retest.'
      - name: Retire beta 1 after verifying the replacement
        run: |
          digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.1.3-beta2" --jq '.assets[0].digest')
          test "$digest" = "sha256:$APK_SHA256"
          gh release delete v1.1.3-beta1 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
