name: Publish AlmaZoom Xiaomi beta 1
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-xiaomi-beta1.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: eb76fc2ff5efdd2b8bb01f0a84c42ae156e6bf15
      APK: AlmaZoom-v1.1.3-xiaomi-beta1.apk
    steps:
      - name: Verify APK and publish prerelease
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "$APK" "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$RELEASE_COMMIT/downloads/$APK"
          echo "c102de3c491a5bb557d03a3ab85d5efc39554857ac4a39e48967c0549cf14d4f  $APK" | sha256sum -c -
          gh release create v1.1.3-xiaomi-beta1 "$APK" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --prerelease --title 'AlmaZoom 1.1.3 · Xiaomi Camera beta 1' --notes 'Experimental profile for Xiaomi Camera 6.3.007270.1 (630072701). Enable Xiaomi Camera in Vector, use rear Photo with regular JPEG and Live Photo off, reach the stock maximum, and tap AlmaZoom. Capture and preview hooks were checked against the camera APK. On-device testing is pending.'
