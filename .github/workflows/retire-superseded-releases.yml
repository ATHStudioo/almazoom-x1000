name: Retire superseded AlmaZoom releases
on:
  push:
    branches: [main]
    paths: [.github/workflows/retire-superseded-releases.yml]
permissions:
  contents: write
jobs:
  retire:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify replacement APKs and remove old releases
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.1.3-beta3" --jq '.assets[] | select(.name == "AlmaZoom-v1.1.3-beta3.apk") | .state')" = uploaded
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.1.3-xiaomi-beta1" --jq '.assets[] | select(.name == "AlmaZoom-v1.1.3-xiaomi-beta1.apk") | .state')" = uploaded
          gh release delete v1.1.3-beta2 --repo "$GITHUB_REPOSITORY" --yes
          gh release delete v1.1.2 --repo "$GITHUB_REPOSITORY" --yes
