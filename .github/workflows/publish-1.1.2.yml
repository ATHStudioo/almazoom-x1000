name: Publish AlmaZoom 1.1.2
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-1.1.2.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: almazoom-release-1.1.2
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: c99f0bdab644b211521d79a882625807765d9881
      APK: AlmaZoom-v1.1.2.apk
    steps:
      - name: Verify and publish the signed APK
        shell: bash
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/downloads/$APK?ref=$RELEASE_COMMIT" > "$APK"
          echo "3aba3aeeb22c6a6b7c86516d44357b2404e124303338e49077388eb6b6af4590  $APK" | sha256sum -c -
          if gh release view v1.1.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.1.2 "$APK" --repo "$GITHUB_REPOSITORY"
          else
            gh release create v1.1.2 "$APK" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" \
              --title 'AlmaZoom 1.1.2 · Samsung Camera' \
              --notes 'Vector module for up to 1000× digital zoom in Samsung Camera. See the README for installation and device compatibility.'
          fi
