name: Replace One UI 8.0 beta with beta 5
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-1.1.3-beta5.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: 86a0584504e207f0a9f5586d293b667071813918
      APK: AlmaZoom-v1.1.3-beta5.apk
      APK_SHA256: 7eba5b7fda61d7a0e31fa7452db909ca93bac8cca4f80dca1f227ccdbd116df2
    steps:
      - name: Publish verified beta APK
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "$APK" "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$RELEASE_COMMIT/downloads/$APK"
          echo "$APK_SHA256  $APK" | sha256sum -c -
          gh release create v1.1.3-beta5 "$APK" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --prerelease --title 'AlmaZoom 1.1.3 beta 5 · One UI 8.0' --notes 'Samsung Camera 16.0.00.66. Fixes the 30× preset label and visible preview magnification beyond the stock maximum. A tester confirmed preview zoom on-device. Saved JPEG output needs separate verification. This beta replaces beta 3 for One UI 8.0.'
      - name: Retire beta 3 after checking new APK
        run: |
          digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.1.3-beta5" --jq '.assets[] | select(.state == "uploaded").digest')
          test "$digest" = "sha256:$APK_SHA256"
          gh release delete v1.1.3-beta3 --repo "$GITHUB_REPOSITORY" --yes
