name: Publish AlmaZoom 1.1.3 beta 3
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-1.1.3-beta3.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: a60940fe352e905332ee98d1688114e1004721f4
      APK: AlmaZoom-v1.1.3-beta3.apk
    steps:
      - name: Verify APK and publish prerelease
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "$APK" "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$RELEASE_COMMIT/downloads/$APK"
          echo "f4d88c351113cd775b52a734fb1dc37d9c43bae7b5ea88e25c6dc163d0ca4f4b  $APK" | sha256sum -c -
          gh release create v1.1.3-beta3 "$APK" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --prerelease --title 'AlmaZoom 1.1.3 beta 3 · One UI 8.0 zoom fix' --notes 'Fixes the One UI 8.0 zoom slider freeze reported on Galaxy S22. Samsung Camera 16 skips an unavailable tick callback and restores stock scrolling if its extension fails. The Camera 17 callback is retained. Includes the experimental Xiaomi Camera 6.3.007270.1 profile from the Xiaomi beta. Build, APK signature and callback dispatch were verified. Physical-device retesting is pending.'
